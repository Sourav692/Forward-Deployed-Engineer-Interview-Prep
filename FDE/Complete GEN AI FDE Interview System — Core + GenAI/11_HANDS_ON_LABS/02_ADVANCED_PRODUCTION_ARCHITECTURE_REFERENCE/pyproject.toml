[project]
name = "genai-fde-production-lab"
version = "0.1.0"
description = "Production-aware GenAI FDE interview lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pytest>=8.0"
]

[project.optional-dependencies]
semantic = [
  "numpy>=1.26",
  "sentence-transformers>=3.0"
]
vertex = [
  "google-cloud-aiplatform>=1.60"
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
