services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: genai_fde
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    ports: ["5173:5173"]
    depends_on: [backend]
