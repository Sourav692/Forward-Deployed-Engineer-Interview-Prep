<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GenAI FDE Interview Lab</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; line-height: 1.5; }
    textarea { width: 100%; min-height: 110px; }
    select, button { padding: 8px; margin-top: 8px; }
    pre { background: #f6f8fa; padding: 16px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>GenAI FDE Interview Lab</h1>
  <p>Ask an enterprise assistant question and inspect the role, citations, safety flags, and decision trace.</p>

  <label>User</label><br />
  <select id="userId">
    <option value="u-sales-1">Sales Rep</option>
    <option value="u-support-1">Support Agent</option>
    <option value="u-manager-1" selected>Manager</option>
    <option value="u-admin-1">Admin</option>
  </select>

  <p><label>Question</label></p>
  <textarea id="question">What renewal risks exist for customer Acme Bank?</textarea><br />
  <button onclick="ask()">Ask</button>

  <h2>Response</h2>
  <pre id="output">Waiting...</pre>

  <script src="app.js"></script>
</body>
</html>
