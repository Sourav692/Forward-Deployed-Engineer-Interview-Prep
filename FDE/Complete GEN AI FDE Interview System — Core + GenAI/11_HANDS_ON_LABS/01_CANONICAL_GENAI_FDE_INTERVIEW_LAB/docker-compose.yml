services:
  genai-fde-api:
    build: .
    container_name: genai-fde-interview-lab-api

    env_file:
      - .env.example

    ports:
      - "8000:8000"

    volumes:
      - ./audit.log:/app/audit.log

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend/streamlit

    container_name: genai-fde-streamlit

    command: >
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8501:8501"

    environment:
      BACKEND_API_URL: http://genai-fde-api:8000

    depends_on:
      - genai-fde-api

  mock-observability:
    image: busybox:1.36

    container_name: genai-fde-mock-observability

    command:
      - sh
      - -c
      - |
        echo "Mock observability service: replace with Prometheus/Grafana/OpenTelemetry Collector"
        sleep 3600