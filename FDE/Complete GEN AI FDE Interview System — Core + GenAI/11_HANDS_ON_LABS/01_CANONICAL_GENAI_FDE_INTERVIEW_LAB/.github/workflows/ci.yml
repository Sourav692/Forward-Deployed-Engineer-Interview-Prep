name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check backend tests

      - name: Security scan
        run: bandit -r backend -x backend/evals,backend/tests -q

      - name: Unit and evaluation tests
        run: pytest

      - name: Docker build validation
        run: docker build -t genai-fde-interview-lab:ci .
